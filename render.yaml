databases:
  - name: clinix-postgres
    databaseName: clinix_emr
    user: clinix_user

services:
  - type: web
    name: clinix
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run deploy:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clinix-postgres
          property: connectionString
